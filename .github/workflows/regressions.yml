name: Library regressions
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: PHP syntax
        run: docker run --rm -v "$PWD:/app:ro" -w /app php:${{ matrix.php }}-cli sh -c 'find lib tests -name "*.php" -print0 | xargs -0 -n1 php -l'
      - name: Security regressions
        run: docker run --rm -v "$PWD:/app:ro" -w /app php:${{ matrix.php }}-cli php tests/security-regressions.php
      - name: Public bootstrap fallback contract
        run: docker run --rm -v "$PWD:/app:ro" -w /app php:${{ matrix.php }}-cli php tests/bootstrap-regressions.php
      - name: Cleanup regressions
        run: docker run --rm -v "$PWD:/app:ro" -w /app php:${{ matrix.php }}-cli php tests/cleanup-regressions.php
      - name: Earlier cleanup alias coexistence
        run: docker run --rm -v "$PWD:/app:ro" -w /app php:${{ matrix.php }}-cli php tests/cleanup-regressions.php --older-alias
      - name: Concurrent register writes
        run: docker run --rm -v "$PWD:/app:ro" -w /app php:${{ matrix.php }}-cli php tests/parallel-regressions.php
      - name: JavaScript syntax
        run: node --check lib/assets/library.js
      - name: Runtime integrity
        run: python3 tests/manifest.py
